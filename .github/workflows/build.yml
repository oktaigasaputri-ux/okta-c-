name: build c++ EXE

"on"
 workflow_dispatch:
 push:

 jobs:
 build:
 runs-on: windows-latest

 steps:
 -name: checkout
  uses: actions/checkout@v4

 -name: build EXE
  run: g++ okta.cpp -o okta.exe -static -static-libgcc -statis-libstdc++

  -name: upload EXE
   uses: actions/upload-artifact@v4
   with:
    name: okta-exe
    name: okta.exe
